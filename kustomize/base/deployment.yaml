apiVersion: apps/v1
kind: Deployment
metadata:
  name: sys-billing
  labels:
    app: sys-billing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sys-billing
  template:
    metadata:
      labels:
        app: sys-billing
    spec:
      containers:
        - name: sys-billing
          image: sys-billing:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: billing-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            # DEF-0110 (CFG-001-c/d): the env-var names now match the ${BILLING_*} placeholders
            # application-prod.yaml reads, so a deployment built from kustomize/ can start. The
            # non-BILLING names the manifests previously set (PRIMARY_ACCOUNT_HOST,
            # EXTERNAL_PRIMARY_ACCOUNT_HOST, PING_FED_HOST, OAUTH_ISSUER_URI, TRUSTSTORE_PASSWORD,
            # BILLING_SAML_USERNAME/PASSWORD) were read by no profile and are removed.
            - name: BILLING_BASE_PATH
              value: /
            - name: BILLING_SAML_AUDIENCE
              value: urn:sts:mulesoft:unt:to:saml:nonprod
            - name: BILLING_ESB_HOST
              value: http://dev5esb.westfieldgrp.corp
            - name: BILLING_WAS_HOST
              value: http://wassvcu.westfieldgrp.corp
            - name: BILLING_STS_HOST
              value: https://idpa1-test.westfieldgrp.corp
            - name: BILLING_VAULT_HOST
              value: https://vault.westfieldgrp.corp
            - name: BILLING_TRUSTSTORE_LOCATION
              value: file:/etc/sys-billing/truststore/truststore.jks
            - name: BILLING_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: billing-truststore-password
            - name: BILLING_JWT_ISSUER_URI
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: billing-jwt-issuer-uri
          volumeMounts:
            - name: truststore
              mountPath: /etc/sys-billing/truststore
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: truststore
          secret:
            secretName: billing-truststore
            optional: true
