apiVersion: apps/v1
kind: Deployment
metadata:
  name: sys-billing
  labels:
    app: sys-billing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sys-billing
  template:
    metadata:
      labels:
        app: sys-billing
    spec:
      containers:
        - name: sys-billing
          image: sys-billing:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: billing-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: PRIMARY_ACCOUNT_HOST
              value: dev5esb.westfieldgrp.corp
            - name: EXTERNAL_PRIMARY_ACCOUNT_HOST
              value: wassvcu.westfieldgrp.corp
            - name: PING_FED_HOST
              value: idpa1-test.westfieldgrp.corp
            - name: BILLING_SAML_USERNAME
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: billing-saml-username
            - name: BILLING_SAML_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: billing-saml-password
            - name: TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: truststore-password
            - name: OAUTH_ISSUER_URI
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: oauth-issuer-uri
          volumeMounts:
            - name: truststore
              mountPath: /etc/sys-billing/truststore
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: truststore
          secret:
            secretName: billing-truststore
            optional: true
