apiVersion: apps/v1
kind: Deployment
metadata:
  name: sys-billing
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: sys-billing
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: PRIMARY_ACCOUNT_HOST
              value: esb.westfieldgrp.corp
            - name: EXTERNAL_PRIMARY_ACCOUNT_HOST
              value: wassvc.westfieldgrp.corp
            - name: PING_FED_HOST
              value: sso.westfieldgrp.corp
