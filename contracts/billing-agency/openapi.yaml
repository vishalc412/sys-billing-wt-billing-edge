openapi: 3.0.3
info:
  title: sys-billing — billing-agency
  version: "1.0.0"
  description: |
    The WAS-backed endpoints: the external (customer-facing) billing view and the two agency daily
    worklists (CAP-009, CAP-010).

    **FROZEN at S3 (scaffold-v1). Read-only at S4.** A mismatch between this document and an
    implementation is a contract defect routed to the migration-architect (S6).

    Documents **implemented legacy behaviour**, not the legacy RAML (ADR-0012). Field names not
    directly evidenced in the knowledge map are marked `x-name-source: inferred` and must be
    confirmed against the captured baseline (PAR-001) — four of the eight legacy endpoints, including
    both worklists and both external routes, have **no test coverage at all** (R-020).
  x-migrated-from:
    - mule:flow/AccountDetailsFlow
    - mule:flow/get-past-due-today-flow
    - mule:flow/get-pending-cancellation-today-flow
  x-adrs: [ADR-0004, ADR-0006, ADR-0010, ADR-0011, ADR-0012, ADR-0013, ADR-0014, ADR-0019,
           ADR-0020, ADR-0031, ADR-0033, ADR-0037]

servers:
  - url: /
    description: Externally visible base path is unknown (U12, R-002).

security:
  - bearerAuth: []

tags:
  - name: externalPrimaryAccount
    description: The customer-facing external billing view. One business question, two keys.
  - name: worklists
    description: Agency daily worklists. Unbounded and unpaged (R-010).

paths:
  /externalPrimaryAccount/{billingAccountNumber}/account-billing:
    get:
      operationId: getExternalAccountBilling
      tags: [externalPrimaryAccount]
      summary: External billing view, keyed by billing account number
      description: |
        km:node/N-0034, N-0053, N-0056. The request ALWAYS asks the back end for the PastDue feature
        set — a business policy with no property and no parameter behind it, so the external view
        always includes past-due information.
      parameters:
        - name: billingAccountNumber
          in: path
          required: true
          schema: { type: string, minLength: 10, maxLength: 10 }
        - $ref: '#/components/parameters/EnvironmentIgnoredButRequired'
        - $ref: '#/components/parameters/InteractionCorrelationId'
      responses:
        '200': { $ref: '#/components/responses/ExternalView' }
        '204': { $ref: '#/components/responses/ExternalNoContent' }
        '400': { $ref: '#/components/responses/ContractViolation' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/RelayedNotFound' }
        '500': { $ref: '#/components/responses/AbsorbedFailure' }
        '502': { $ref: '#/components/responses/UpstreamIdentityFailure' }

  /externalPrimaryAccount/{policyNumber}/policy-billing:
    get:
      operationId: getExternalPolicyBilling
      tags: [externalPrimaryAccount]
      summary: External billing view, keyed by policy number
      description: |
        km:node/N-0038. The same business question and the same shared flow as `account-billing`;
        only the key differs. The unmatched identifier is OMITTED from the SOAP request rather than
        sent empty — the opposite of the ESB convention (ADR-0006).
      parameters:
        - name: policyNumber
          in: path
          required: true
          schema: { type: string, minLength: 7, maxLength: 7 }
        - $ref: '#/components/parameters/EnvironmentIgnoredButRequired'
        - $ref: '#/components/parameters/InteractionCorrelationId'
      responses:
        '200': { $ref: '#/components/responses/ExternalView' }
        '204': { $ref: '#/components/responses/ExternalNoContent' }
        '400': { $ref: '#/components/responses/ContractViolation' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/RelayedNotFound' }
        '500': { $ref: '#/components/responses/AbsorbedFailure' }
        '502': { $ref: '#/components/responses/UpstreamIdentityFailure' }

  /pastDueToday/{agencyCode}:
    get:
      operationId: getPastDueToday
      tags: [worklists]
      summary: Accounts that became past due today, for one agency
      description: |
        km:node/N-0039, N-0058, N-0061. "Today" is decided entirely by the back end; this API sends
        no date at all, and the back end's clock and timezone are unknown (R-011).

        **Entitlement is now enforced (ADR-0037).** The legacy accepted any agency code from any
        authenticated caller, returning the named insured's name and postal address plus financial
        distress information for an arbitrary agency. The caller's `agencyCodes` claim must contain
        the requested code, or the request is rejected with 403.

        Response size is **unbounded and unpaged** and shares the 10 s timeout used for a
        single-account lookup — the most likely timeout candidate in the system (R-010).
      parameters:
        - $ref: '#/components/parameters/AgencyCode'
        - $ref: '#/components/parameters/SubAgenciesIncluded'
        - $ref: '#/components/parameters/EnvironmentIgnoredButRequired'
        - $ref: '#/components/parameters/InteractionCorrelationId'
      responses:
        '200':
          description: The worklist. A single entry is still an array.
          headers:
            x-correlation-id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PastDueEntry' }
        '204':
          description: |
            The backend response carried no `pastDues` element at all (km:node/N-0058). **No body**
            (ADR-0020); the legacy left the raw SOAP payload in place. Note an EMPTY `<pastDues/>`
            element does NOT reach this path — it passes the presence guard and maps to an array
            containing one all-null entry (km:node/N-0061 ec), which is preserved.
          x-legacy-defect: ADR-0031
        '400': { $ref: '#/components/responses/ContractViolation' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/EntitlementDenied' }
        '404': { $ref: '#/components/responses/RelayedNotFound' }
        '500': { $ref: '#/components/responses/AbsorbedFailure' }
        '502': { $ref: '#/components/responses/UpstreamIdentityFailure' }

  /pendingCancelToday/{agencyCode}:
    get:
      operationId: getPendingCancelToday
      tags: [worklists]
      summary: Policies pending cancellation today, for one agency
      description: |
        km:node/N-0041, N-0063, N-0066. Same shape as `/pastDueToday`; the date reported is the
        **tentative** cancellation date from the billing system, and the `tentative` qualifier is
        lost in the field name `cancelDate` — a consumer cannot tell the date may move
        (km:node/N-0066 ec). Preserved.

        Entitlement enforced as for `/pastDueToday` (ADR-0037).
      parameters:
        - $ref: '#/components/parameters/AgencyCode'
        - $ref: '#/components/parameters/SubAgenciesIncluded'
        - $ref: '#/components/parameters/EnvironmentIgnoredButRequired'
        - $ref: '#/components/parameters/InteractionCorrelationId'
      responses:
        '200':
          description: The worklist. A single entry is still an array.
          headers:
            x-correlation-id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PendingCancellationEntry' }
        '204':
          description: No `pendingCancellations` element in the backend response. **No body** (ADR-0020).
          x-legacy-defect: ADR-0031
        '400': { $ref: '#/components/responses/ContractViolation' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/EntitlementDenied' }
        '404': { $ref: '#/components/responses/RelayedNotFound' }
        '500': { $ref: '#/components/responses/AbsorbedFailure' }
        '502': { $ref: '#/components/responses/UpstreamIdentityFailure' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Validated by the service (ADR-0013). Must carry `agencyCodes` for the worklists (ADR-0037).

  headers:
    CorrelationId:
      description: Echoed on every response by the main listener (km:node/N-0023).
      schema: { type: string }
    FailureOrigin:
      description: Which system actually failed (ADR-0033). Additive; no legacy response carries it.
      schema:
        type: string
        enum: [upstream-esb, upstream-was, upstream-sts, upstream-vault, gateway, this-service]

  parameters:
    AgencyCode:
      name: agencyCode
      in: path
      required: true
      description: |
        The agency whose worklist is requested. Under ADR-0037 the caller's `agencyCodes` claim must
        contain this value. In the legacy the claim was captured for the audit log and never checked.
      schema: { type: string }
    SubAgenciesIncluded:
      name: subAgenciesIncluded
      in: query
      required: false
      description: |
        When omitted the back end is not told either way and applies its own default, which is
        UNKNOWN (U9, R-012) — so the blast radius of a request is not bounded by this API.
      schema: { type: boolean }
    EnvironmentIgnoredButRequired:
      name: environment
      in: query
      required: true
      description: |
        **Required and read by nothing.** The back end is chosen entirely by the deployment
        environment. Omitting it yields 400 with no indication of which validation failed. Preserved
        exactly (ADR-0019); the three `/primaryAccount*` endpoints do not carry it, so the API is
        internally inconsistent about it.
      schema:
        type: string
        enum: [DEV, QA, QAN, SIT, STAGE, PERF, PROD]
      x-legacy-defect: ADR-0019
    InteractionCorrelationId:
      name: x-interaction-correlation-id
      in: header
      required: false
      schema: { type: string }

  responses:
    ExternalView:
      description: |
        The backend response passed through essentially unchanged, with one correction: repeated
        `policyNumbers` elements are collected into a single array so the caller always sees a list
        (km:node/N-0056). The response is emitted UNWRAPPED — the legacy RAML declares an
        `externalPrimaryAccountResponse` wrapper that the implementation does not produce (ADR-0012).
      headers:
        x-correlation-id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ExternalPrimaryAccount' }
    ExternalNoContent:
      description: |
        The backend returned something other than an `ExternalPrimaryAccountResponse`, or a fault
        classified as account-not-found (logged at ERROR). "We understood you, there is nothing to
        show." **No body** — the legacy left the raw SOAP or the FAULT content in place; ADR-0031
        corrects that, and ADR-0020 governs.
      x-legacy-defect: ADR-0031
    EntitlementDenied:
      description: |
        The caller's `agencyCodes` claim does not contain the requested `agencyCode`, or the claim is
        absent or empty (deny, not allow). **New behaviour at cutover — ADR-0037.**
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    ContractViolation:
      description: Fixed body, no diagnostic detail, exactly as the legacy APIkit handlers emit (ADR-0042).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MessageOnlyError' }
          example: { message: "Bad request" }
    Unauthorised:
      description: Body shape is a divergence — the legacy response came from API Manager (R-003, ADR-0013).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
      x-unknown: R-003
    Forbidden:
      description: Relayed from the back end.
      headers:
        X-Billing-Failure-Origin: { $ref: '#/components/headers/FailureOrigin' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AbsorbedFailureBody' }
    RelayedNotFound:
      description: The back end's 404, relayed verbatim (ADR-0033).
      headers:
        X-Billing-Failure-Origin: { $ref: '#/components/headers/FailureOrigin' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AbsorbedFailureBody' }
      x-legacy-defect: ADR-0033
    AbsorbedFailure:
      description: The `error_Flow` body (km:node/N-0069). `errorCause` is not redacted (ADR-0015).
      headers:
        X-Billing-Failure-Origin: { $ref: '#/components/headers/FailureOrigin' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AbsorbedFailureBody' }
    UpstreamIdentityFailure:
      description: No SAML assertion could be obtained for our service account (ADR-0007). Divergence from legacy.
      headers:
        X-Billing-Failure-Origin: { $ref: '#/components/headers/FailureOrigin' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AbsorbedFailureBody' }

  schemas:
    ExternalPrimaryAccount:
      type: object
      additionalProperties: true
      x-migrated-from: km:node/N-0056
      description: |
        Pass-through. Any backend field addition flows straight to the caller with no code change and
        no contract change — that is the legacy behaviour and it is preserved.
      properties:
        policyNumbers:
          type: array
          items: { type: string }
          description: |
            Always a list, even for one policy and even for none. Collected with a DESCENDANT
            selector, so a `policyNumbers` element nested anywhere in the response is hoisted into
            this top-level array (km:node/N-0056 ec). Field order differs from the backend response
            because the rebuilt key is appended last — invisible to a JSON parser, visible in a
            byte-comparison golden test.
    PastDueEntry:
      type: object
      x-migrated-from: km:node/N-0061
      x-name-source: inferred
      properties:
        policyNumber: { type: string }
        name:
          type: string
          description: The named insured's name.
        addressLine1: { type: string }
        addressLine2:
          type: string
          nullable: true
          description: Emitted even when absent, as null. Consumers must handle a null address line.
        city: { type: string }
        state: { type: string }
        zip: { type: string }
        overDueAmount: { $ref: '#/components/schemas/MoneyString' }
        dueDate: { $ref: '#/components/schemas/PassThroughDate' }
    PendingCancellationEntry:
      type: object
      x-migrated-from: km:node/N-0066
      x-name-source: inferred
      properties:
        policyNumber: { type: string }
        name: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: string, nullable: true }
        city: { type: string }
        state: { type: string }
        zip: { type: string }
        overDueAmount: { $ref: '#/components/schemas/MoneyString' }
        cancelDate:
          allOf: [{ $ref: '#/components/schemas/PassThroughDate' }]
          description: |
            The **tentative** cancellation date from the billing system. The source field is
            `tentativeCancelDate`; the qualifier is lost here, so a consumer cannot tell the date may
            move (km:node/N-0066 ec). Preserved.
    MoneyString:
      type: string
      nullable: true
      description: |
        The **minimum amount due EXCLUDING fees** — fees are deliberately not part of the figure the
        agency sees. Rendered as a STRING with exactly two decimals including trailing zeros, so it
        can be displayed without further formatting. The sibling `/primaryAccount` endpoints emit
        numbers for the same concept (ADR-0025, ADR-0004). No null guard exists: an absent source
        value is emitted as null rather than failing the record.
      example: "1284.50"
    PassThroughDate:
      type: string
      nullable: true
      description: Raw backend string, no parsing or validation.
    MessageOnlyError:
      type: object
      required: [message]
      properties:
        message: { type: string }
    AbsorbedFailureBody:
      type: object
      x-migrated-from: km:node/N-0069
      properties:
        faultActor: { type: string }
        errorDesc: { type: string }
        errorType:
          type: object
          additionalProperties: true
        errorCause: { type: string, nullable: true }
        correlationId: { type: string }
    ProblemDetail:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
