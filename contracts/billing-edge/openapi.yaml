openapi: 3.0.3
info:
  title: sys-billing — billing-edge
  version: "1.0.0"
  description: |
    The admission surface and the two endpoints the edge module serves itself: `/info` (CAP-013) and
    the API documentation console (CAP-014). It also defines the **canonical** security scheme,
    correlation headers and contract-violation responses that the other two modules reference; where
    those definitions are repeated in `billing-account` and `billing-agency`, this file is the
    source of truth.

    **FROZEN at S3 (scaffold-v1). Read-only at S4.**

    Behaviours defined here and enforced for every request, regardless of which module answers it:
    every request passes one funnel — build the audit record, log entry, route, log exit, log the
    request/response pair — and **nothing bypasses the audit trail** except the console, which is
    unaudited (preserved, ADR-0017/ADR-0038). A failure building the audit record fails the whole
    request before any business logic runs (ADR-0017).
  x-migrated-from:
    - mule:flow/sapi-billing-search-main
    - mule:flow/sapi-billing-search-console
    - mule:flow/setRequestResponse
    - mule:flow/responseLogFlow
    - mule:flow/get:\info
  x-adrs: [ADR-0010, ADR-0012, ADR-0013, ADR-0016, ADR-0017, ADR-0018, ADR-0033, ADR-0035,
           ADR-0036, ADR-0037, ADR-0038, ADR-0042]

servers:
  - url: /
    description: Externally visible base path is unknown (U12, R-002). The listener is plain HTTP on 8081 with TLS terminated upstream.

security:
  - bearerAuth: []

paths:
  /info:
    get:
      operationId: getBuildInfo
      tags: [operations]
      summary: Build provenance
      description: |
        km:node/N-0043, N-0044. Reports which build is running, for pipeline and operational
        verification. The only endpoint that calls no back end.

        **It requires a bearer token**, so it cannot be used as an unauthenticated health probe
        (km:node/N-0043 ec) — preserved (ADR-0013). Kubernetes-style probes use the actuator
        endpoints, not this one.

        When a piece of build metadata is unavailable the endpoint still answers, using `'0'` for the
        build number and `'--'` for textual fields. ADR-0018 additionally requires that build-metadata
        substitution actually runs: the legacy ships unsubstituted Maven tokens, which resolve
        *successfully* to the token text so the defaults never fire and `/info` reports
        `@pomBuildNumber@` as a build number. In the target that is a build failure, not a runtime
        surprise.
      responses:
        '200':
          description: Build metadata plus the server's current timestamp.
          headers:
            x-correlation-id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildInfo' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '500': { $ref: '#/components/responses/UnhandledFailure' }

  /console/{path}:
    get:
      operationId: getConsole
      tags: [operations]
      summary: API documentation console (non-production only)
      description: |
        km:node/N-0031, N-0032, N-0033. The legacy serves this on a HARDCODED `/console/*` path,
        **unconditionally in production**, unaudited — publishing the contract of a customer-billing
        API to anyone who can reach the listener.

        **Corrected (ADR-0038):** the path and the enablement are configuration, and the console is
        disabled in the production profile. It remains unaudited in the environments where it runs;
        adding audit records for console traffic is an audit-stream change owned by ADR-0017.
      security: []
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The console. Unlike the main listener, the console does NOT echo the correlation id (km:node/N-0032).
          content:
            text/html:
              schema: { type: string }
        '404':
          description: |
            Unknown console path, or the console is disabled (production). Fixed legacy body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageOnlyError' }
              example: { message: "Resource not found" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        **Canonical definition.** Every operation of every module requires a bearer access token
        carrying subject, email, client id, an optional impersonation actor (in either the nested
        `act` or the flat `actSub` representation — ADR-0036) and a list of agency codes.

        The legacy implements no inbound authentication at all: enforcement is attached to the API
        instance in API Manager, and **that policy set was never exported** (U5, R-003). ADR-0013
        moves validation into the service; the rejection body is therefore a documented divergence
        from a legacy response nobody has seen.

  headers:
    CorrelationId:
      description: |
        Mule's own correlation id, echoed on every response of the main listener (km:node/N-0023).
        Two identifiers are tracked: this one, and the caller-supplied `x-interaction-correlation-id`,
        so a business interaction spanning several API calls can be reassembled (CAP-003).
      schema: { type: string }

  responses:
    Unauthorised:
      description: |
        No token, or a token the service rejected (ADR-0013). Divergence: the legacy response was
        produced by API Manager and its shape is unknown (R-003).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
      x-unknown: R-003
    UnhandledFailure:
      description: |
        A failure that no flow handler absorbed — in the legacy, this is the path through
        `sapi-common-errorhandler`, an opaque shared module whose output, status and possible
        597/598/599 timeout mapping are **unknown** (U1, R-013). ADR-0016 implements an assumed
        contract (the `error_Flow` shape, the derived status of ADR-0033, no 597/598/599) and marks it
        here. When R-013 is answered, any difference is a contract defect routed to the architect.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AbsorbedFailureBody' }
      x-unknown: R-013

  schemas:
    BuildInfo:
      type: object
      x-migrated-from: km:node/N-0044
      x-name-source: inferred
      properties:
        buildNumber:
          type: string
          description: "'0' when unavailable."
          example: "1244"
        buildName:
          type: string
          description: "'--' when unavailable."
        gitCommit:
          type: string
          description: "'--' when unavailable."
        timestamp:
          type: string
          description: |
            The server's current timestamp. The timezone is the container's and is pinned nowhere in
            the source (km:node/N-0044 ec).
    MessageOnlyError:
      type: object
      required: [message]
      description: |
        The shape every locally-produced contract violation uses: one field, a fixed string, no
        diagnostic detail. The legacy RAML declares `commonError`
        (faultActor/faultCode/faultMessage/faultDetail/faultTime/innerFault) for these responses and
        **the application has never emitted it** (ADR-0042). The strings are exact:
        "Bad request" (400), "Resource not found" (404), "Method not allowed" (405),
        "Not acceptable" (406), "Unsupported media type" (415), "Not Implemented" (501).
      properties:
        message: { type: string }
      x-legacy-defect: ADR-0042
    AbsorbedFailureBody:
      type: object
      x-migrated-from: km:node/N-0069
      properties:
        faultActor: { type: string }
        errorDesc: { type: string }
        errorType:
          type: object
          additionalProperties: true
        errorCause: { type: string, nullable: true }
        correlationId: { type: string }
    ProblemDetail:
      type: object
      description: RFC 9457. Used only for responses the legacy never produced at all (ADR-0042).
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }

  examples:
    routingFailureClasses:
      summary: The six contract-violation classes the router produces (km:node/N-0024 … N-0029)
      value:
        "400": { message: "Bad request" }
        "404": { message: "Resource not found" }
        "405": { message: "Method not allowed" }
        "406": { message: "Not acceptable" }
        "415": { message: "Unsupported media type" }
        "501": { message: "Not Implemented" }
