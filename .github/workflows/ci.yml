
# MuleShift CI gates. Every gate is mechanical: none of them accepts an agent's self-assessment.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build + unit tests + ArchUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # reference/prior-run is not in the reactor (ADR-0043); nothing here builds it.
      - name: Build and test
        run: ./mvnw -B clean verify

  scope-check:
    name: scope check (changed files subset of the packet's allowed_paths)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Changed files must be inside the declared packet scope
        run: |
          # The packet id is the PR branch prefix, e.g. wp-002-billing-account/...
          PACKET="$(echo "${GITHUB_HEAD_REF}" | cut -d/ -f1)"
          echo "packet: ${PACKET}"
          test -f ".muleshift/packets/${PACKET}.paths" || {
            echo "::error::no allowed_paths manifest for packet ${PACKET}"; exit 1; }
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > /tmp/changed.txt
          FAIL=0
          while read -r f; do
            [ -z "$f" ] && continue
            if ! grep -qE "$(paste -sd'|' ".muleshift/packets/${PACKET}.paths")" <<< "$f"; then
              echo "::error file=$f::outside packet ${PACKET} allowed_paths"; FAIL=1
            fi
          done < /tmp/changed.txt
          exit $FAIL

  frozen-paths:
    name: frozen paths (contracts, platform, reference)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: contracts/, platform/ and reference/ are frozen at S4
        run: |
          if git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" \
             | grep -E '^(contracts/|platform/|reference/)'; then
            echo "::error::frozen path modified. Contract or platform changes are a defect routed to the architect (ADR-0012)."
            exit 1
          fi

  dependency-check:
    name: dependency check (nothing outside platform-bom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: temurin, cache: maven }
      - name: No dependency may declare its own version outside platform-bom
        run: |
          if grep -rEn '<version>' --include=pom.xml services/ | grep -v '<relativePath>'; then
            echo "::error::a module POM pins a version. Versions belong in platform-bom (ADR-0044)."
            exit 1
          fi
      - name: Banned dependencies (each has an ADR saying why)
        run: |
          if grep -rEn 'mapstruct|resilience4j-retry|spring-retry|com\.ibm\.mq|caffeine|cxf' \
               --include=pom.xml platform/ services/; then
            echo "::error::banned dependency. See ADR-0002, ADR-0003, ADR-0009, ADR-0014, ADR-0040."
            exit 1
          fi

  annotation-check:
    name: annotation check (@MigratedFrom resolves to a real knowledge-map node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every @MigratedFrom value resolves
        run: |
          # The knowledge map is delivered with each work packet; CI reads the committed copy.
          test -f .muleshift/knowledge-map-nodes.txt || {
            echo "::error::knowledge-map node list missing"; exit 1; }
          grep -rhoE '@MigratedFrom\(\s*(value\s*=\s*)?"[^"]+"' --include=*.java services/ platform/ \
            | grep -oE '"[^"]+"' | tr -d '"' | sort -u > /tmp/refs.txt || true
          FAIL=0
          while read -r ref; do
            [ -z "$ref" ] && continue
            node="$(echo "$ref" | grep -oE 'N-[0-9]{4}' || true)"
            if [ -n "$node" ] && ! grep -qx "$node" .muleshift/knowledge-map-nodes.txt; then
              echo "::error::@MigratedFrom references unknown node: $ref"; FAIL=1
            fi
          done < /tmp/refs.txt
          exit $FAIL

  contract-verify:
    name: contract verify (implementation matches the frozen OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: temurin, cache: maven }
      - name: Contract tests
        run: ./mvnw -B -Dtest='*ContractTest' test
      - name: Every x-legacy-defect and x-unknown marker resolves
        run: |
          FAIL=0
          for adr in $(grep -rhoE 'x-legacy-defect: ADR-[0-9]{4}' contracts/ | grep -oE 'ADR-[0-9]{4}' | sort -u); do
            ls docs/adr/${adr}-*.md >/dev/null 2>&1 || { echo "::error::$adr referenced by a contract does not exist"; FAIL=1; }
          done
          for r in $(grep -rhoE 'x-unknown: R-[0-9]{3}' contracts/ | grep -oE 'R-[0-9]{3}' | sort -u); do
            echo "contract carries open risk marker: $r"
          done
          exit $FAIL

  sast:
    name: SAST + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No secret material committed
        run: |
          # ADR-0008/0039: nothing in this repository may contain a credential, and the legacy
          # secure-properties ciphertext must never reappear.
          if grep -rEn '!\[[A-Za-z0-9+/=]{16,}\]' --include='*.yaml' --include='*.yml' \
               --include='*.properties' platform/ services/ contracts/ kustomize/; then
            echo "::error::encrypted legacy secret material found (ADR-0039)"; exit 1
          fi
