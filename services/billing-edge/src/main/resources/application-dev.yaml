# dev. API Manager instance 16888213, recorded verbatim at km:node/N-0004 ec 1.
#
# Host names are supplied at deployment time with NO default: the legacy dev.properties values are
# not carried in this work packet's knowledge slice, and inventing one would be worse than failing
# loudly. StartupConfigurationValidator names whichever is missing (ADR-0018). See DEF-0002.
billing:
  api:
    id: "16888213"
    base-path: ${BILLING_BASE_PATH:/}
  pasm-id-billing: "1988"
  console:
    enabled: true
    path: /console
  saml:
    cache-ttl-seconds: 0
    audience: ${BILLING_SAML_AUDIENCE}
  backend:
    esb:
      host: ${BILLING_ESB_HOST}
      connect-timeout: 10s
      response-timeout: 30s
    was:
      host: ${BILLING_WAS_HOST}
      connect-timeout: 10s
      response-timeout: 10s
    sts:
      host: ${BILLING_STS_HOST}
      connect-timeout: 5s
      response-timeout: 10s
    vault:
      host: ${BILLING_VAULT_HOST}
      connect-timeout: 5s
      response-timeout: 10s
  truststore:
    location: ${BILLING_TRUSTSTORE_LOCATION}
    password: ${BILLING_TRUSTSTORE_PASSWORD}
    client-certificate: false

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${BILLING_JWT_ISSUER_URI}
